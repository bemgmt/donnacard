<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <title>DONNA — Operational Intelligence</title>
  <meta name="description" content="DONNA AR Business Card Experience">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="slam"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0B1B2B; font-family: 'Helvetica Neue', Arial, sans-serif; }

    #overlay-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(54, 209, 255, 0.9);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 1000;
      text-shadow: 0 0 20px rgba(54, 209, 255, 0.5);
    }
    #overlay-text.visible { opacity: 1; }

    #white-fade {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
      z-index: 999;
    }
    #white-fade.active { opacity: 1; pointer-events: all; }

    /* ── Guidance banner ── */
    #ar-guidance {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(54, 209, 255, 0.85);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1001;
      text-shadow: 0 0 12px rgba(54, 209, 255, 0.4);
      white-space: nowrap;
    }
    #ar-guidance.visible { opacity: 1; }

    /* ── Profile overlay ── */
    .profile-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px 48px;
      pointer-events: none;
      z-index: 1100;
      opacity: 0;
    }
    .profile-overlay > * { pointer-events: auto; }

    .po-header {
      text-align: center;
      margin-bottom: 14px;
    }
    .po-name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #36D1FF;
      text-shadow: 0 0 18px rgba(54, 209, 255, 0.5), 0 0 40px rgba(54, 209, 255, 0.15);
      margin: 0;
    }
    .po-tagline {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 3px;
      color: rgba(138, 108, 255, 0.85);
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Video tile */
    .po-video-tile {
      position: relative;
      width: 100%;
      max-width: 320px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(54, 209, 255, 0.25);
      box-shadow: 0 0 20px rgba(54, 209, 255, 0.1), inset 0 0 20px rgba(11, 27, 43, 0.6);
      background: rgba(11, 27, 43, 0.85);
    }
    .po-video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #0B1B2B;
    }
    .po-play-btn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(54, 209, 255, 0.7);
      background: rgba(11, 27, 43, 0.7);
      color: #36D1FF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, opacity 0.3s;
      box-shadow: 0 0 16px rgba(54, 209, 255, 0.25);
      -webkit-tap-highlight-color: transparent;
    }
    .po-play-btn svg { width: 22px; height: 22px; }
    .po-play-btn:active {
      border-color: #36D1FF;
      box-shadow: 0 0 24px rgba(54, 209, 255, 0.5);
    }

    /* CTA buttons */
    .po-cta-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 14px;
    }
    .po-cta-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: 10px;
      border: 1px solid rgba(54, 209, 255, 0.35);
      background: rgba(11, 27, 43, 0.75);
      color: #36D1FF;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 0 12px rgba(54, 209, 255, 0.08);
      -webkit-tap-highlight-color: transparent;
    }
    .po-cta-btn:active {
      background: rgba(54, 209, 255, 0.12);
      border-color: #36D1FF;
      box-shadow: 0 0 20px rgba(54, 209, 255, 0.3);
    }
    .po-cta-icon svg { width: 16px; height: 16px; }
    .po-cta-icon { display: flex; }

    /* Social row */
    .po-social-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 320px;
    }
    .po-social-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(138, 108, 255, 0.35);
      background: rgba(11, 27, 43, 0.7);
      color: #8A6CFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
      box-shadow: 0 0 10px rgba(138, 108, 255, 0.08);
      -webkit-tap-highlight-color: transparent;
    }
    .po-social-btn svg { width: 20px; height: 20px; }
    .po-social-btn:active {
      color: #B8A4FF;
      border-color: #8A6CFF;
      box-shadow: 0 0 20px rgba(138, 108, 255, 0.35);
    }

    /* Fallback mode -- standalone page without AR */
    .po-fallback-mode {
      background: #0B1B2B;
      justify-content: center;
      padding-top: 48px;
    }

    /* ── Non-AR fallback section ── */
    #fallback-page {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0B1B2B;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      z-index: 1200;
      color: #fff;
      text-align: center;
    }
    #fallback-page.visible { display: flex; }
    .fallback-title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #36D1FF;
      text-shadow: 0 0 18px rgba(54, 209, 255, 0.4);
      margin-bottom: 6px;
    }
    .fallback-subtitle {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 3px;
      color: rgba(138, 108, 255, 0.85);
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .fallback-msg {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 24px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
<div id="overlay-text">Entering Operational Intelligence Layer</div>
<div id="white-fade"></div>
<div id="ar-guidance">Point camera at card</div>

<div id="fallback-page">
  <div class="fallback-title">DONNA</div>
  <div class="fallback-subtitle">Operational Intelligence</div>
  <div class="fallback-msg">AR experience requires camera access.<br>Use the links below to connect.</div>
</div>

<script src="bundle.js"></script>
</body>

</html>
